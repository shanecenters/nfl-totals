<!DOCTYPE html>
<html data-host-mode="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026 NFL Game Totals - Team Filter</title>
  <script>Object.defineProperty(document, "cookie", {get: function() { return ""; },set: function() {},configurable: false});</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    :root { 
      --host-bg: rgb(14, 18, 23); 
      --host-fg: rgb(238, 237, 228); 
      --host-fg-muted: rgb(162, 166, 170); 
      --host-card: rgba(255, 255, 255, 0.04); 
      --host-card-fg: rgb(238, 237, 228); 
      --host-input: rgba(255, 255, 255, 0.04); 
      --host-muted: rgba(255, 255, 255, 0.04); 
      --host-border: rgba(255, 255, 255, 0.06); 
      --host-border-hover: rgba(255, 255, 255, 0.12); 
      --host-primary: rgb(18, 92, 161); 
      --host-secondary: rgba(255, 255, 255, 0.04); 
      --host-secondary-fg: rgb(238, 237, 228); 
      --host-success: #22c55e; 
      --host-error: #ef4444; 
    } 
    * { box-sizing: border-box; margin: 0; padding: 0; } 
    :root, html, body { 
      width: 100%; 
      max-width: 100%; 
      height: auto; 
      overflow-x: hidden; 
      overflow-y: visible; 
      background: transparent; 
      font-family: Inter, system-ui, -apple-system, sans-serif; 
    } 
    #sandbox-content { width: 100%; }
    @media (max-width: 640px) { 
      :where(#sandbox-content svg, #sandbox-content img) { 
        max-width: 100%; 
        height: auto; 
      } 
    }
    
    /* Enhanced Filter Styles */
    .filter-section {
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    
    .filter-label {
      color: #94a3b8;
      font-size: 14px;
    }
    
    .team-select {
      flex: 1;
      min-width: 200px;
      background: #334155;
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: Inter, sans-serif;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    
    .team-select:hover {
      border-color: rgba(255, 255, 255, 0.2);
    }
    
    .team-select:focus {
      outline: none;
      border-color: #38bdf8;
    }
    
    .team-select option {
      background: #1e293b;
      color: #e2e8f0;
    }
    
    .filter-stats {
      color: #94a3b8;
      font-size: 13px;
      margin-left: auto;
    }
    
    .reset-btn {
      background: #334155;
      color: #e2e8f0;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .reset-btn:hover {
      background: #475569;
    }
  </style>
</head>
<body>
  <div id="sandbox-content">
    <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#e2e8f0;padding:22px;border-radius:14px;max-width:700px;margin:0 auto;">
      <h2 style="margin:0 0 4px;font-size:20px;">2026 NFL: Every Game Total — Chronological</h2>
      <p style="margin:0 0 15px;color:#94a3b8;font-size:13px;">Use the dropdown to filter games by team, or view all games. Green = went Over, red = went Under.</p>

      <div class="filter-section">
        <label class="filter-label">Filter:</label>
        <select class="team-select" id="teamFilter">
          <option value="all">All Teams</option>
        </select>
        <span class="filter-stats" id="filterStats"></span>
        <button class="reset-btn" onclick="resetFilter()">Reset</button>
      </div>

      <div id="toast" style="background: rgb(51, 65, 85); color: rgb(226, 232, 240); font-size: 13px; padding: 8px 12px; border-radius: 6px; margin-bottom: 10px; opacity: 0; transition: opacity 0.25s;">Code selected</div>

      <div style="height:1060px;">
        <canvas id="c" width="1312" height="2120" style="display: block; box-sizing: border-box; height: 1060px; width: 656px;"></canvas>
      </div>

      <div id="detail" style="margin-top:14px;background:#1e293b;border-left:4px solid #38bdf8;padding:12px 16px;border-radius:8px;min-height:58px;font-size:14px;">
        <span style="color:#94a3b8">Click any bar to see the matchup, line and result.</span>
      </div>

      <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
      <script>
        var DATA=[
          ["10/8","TB",24,"DAL",16,49.5,"U",5]
        ];

        var TEAM_ABBREVIATIONS = [
          "ARI", "ATL", "BAL", "BUF", "CAR", "CHI", "CIN", "CLE",
          "DAL", "DEN", "DET", "GB", "HOU", "IND", "JAX", "KC",
          "LAC", "LAR", "LV", "MIA", "MIN", "NE", "NO", "NYG",
          "NYJ", "PHI", "PIT", "SEA", "SF", "TB", "TEN", "WSH"
        ];

        // Populate team dropdown
        var teamSelect = document.getElementById("teamFilter");
        TEAM_ABBREVIATIONS.forEach(function(team) {
          var option = document.createElement("option");
          option.value = team;
          option.textContent = team;
          teamSelect.appendChild(option);
        });

        var currentFilter = "all";
        var sel = -1;

        // Calculate actual totals for bars
        var actualTotals = DATA.map(function(d) { return d[2] + d[4]; });
        
        var labels = DATA.map(function(d) { return d[0] + "  ·  " + d[1] + " @" + d[3]; });
        var vals = actualTotals;
        var base = DATA.map(function(d) { return d[6] === "O" ? "#22c55e" : "#ef4444"; });
        var avg = vals.reduce(function(a, b) { return a + b; }, 0) / vals.length;
        
        var detail = document.getElementById("detail");

        function renderDetail() {
          if (sel < 0) {
            detail.innerHTML = '<span style="color:#94a3b8">Click any bar to see the matchup, line and result.</span>';
            return;
          }
          var d = DATA[sel], actual = d[2] + d[4], diff = (actual - d[5]).toFixed(1), over = d[6] === "O";
          detail.innerHTML = '<div style="font-size:15px;font-weight:700;margin-bottom:6px">Week ' + d[7] + ' · ' + d[0] + ' · ' + d[1] + ' ' + d[2] + ', ' + d[3] + ' ' + d[4] + '</div>'
            + '<div style="color:#cbd5e1;font-size:13px">Over/Under line: <b>' + d[5] + '</b> &nbsp;·&nbsp; Final total: <b>' + actual + '</b></div>'
            + '<div style="margin-top:6px;font-weight:800;color:' + (over ? "#22c55e" : "#ef4444") + '">' + (over ? "OVER" : "UNDER") + ' by ' + Math.abs(diff) + '</div>';
          detail.style.borderLeftColor = over ? "#22c55e" : "#ef4444";
        }

        function paint() {
          if (!chart) return;
          chart.data.datasets[0].borderColor = base.map(function(c, i) { return i === sel ? "#ffffff" : c; });
          chart.data.datasets[0].borderWidth = base.map(function(c, i) { return i === sel ? 3 : 0; });
          chart.update('none');
        }

        function getFilteredData() {
          if (currentFilter === "all") {
            return { data: DATA, labels: labels, vals: vals, base: base };
          }
          
          var filteredIndices = [];
          for (var i = 0; i < DATA.length; i++) {
            if (DATA[i][1] === currentFilter || DATA[i][3] === currentFilter) {
              filteredIndices.push(i);
            }
          }
          
          return {
            data: filteredIndices.map(function(i) { return DATA[i]; }),
            labels: filteredIndices.map(function(i) { return labels[i]; }),
            vals: filteredIndices.map(function(i) { return vals[i]; }),
            base: filteredIndices.map(function(i) { return base[i]; }),
            indices: filteredIndices
          };
        }

        function updateChart() {
          var filtered = getFilteredData();
          var newAvg = filtered.vals.reduce(function(a, b) { return a + b; }, 0) / filtered.vals.length;
          
          chart.data.labels = filtered.labels;
          chart.data.datasets[0].data = filtered.vals;
          chart.data.datasets[0].backgroundColor = filtered.base;
          chart.data.datasets[1].data = filtered.vals.map(function() { return newAvg; });
          chart.data.datasets[1].label = "Season average (" + newAvg.toFixed(1) + ")";
          
          sel = -1;
          renderDetail();
          chart.update();
          updateStats();
        }

        function updateStats() {
          var statsDiv = document.getElementById("filterStats");
          if (currentFilter === "all") {
            statsDiv.textContent = DATA.length + " games";
          } else {
            var filtered = getFilteredData();
            var overCount = 0;
            filtered.data.forEach(function(d) {
              if (d[6] === "O") overCount++;
            });
            statsDiv.textContent = filtered.data.length + " games · " + overCount + " Over, " + (filtered.data.length - overCount) + " Under";
          }
        }

        function resetFilter() {
          currentFilter = "all";
          teamSelect.value = "all";
          updateChart();
        }

        teamSelect.addEventListener("change", function() {
          currentFilter = this.value;
          updateChart();
        });

        var chart = new Chart(document.getElementById("c"), {
          type: "bar",
          data: {
            labels: labels,
            datasets: [
              { label: "Actual game total", data: vals, backgroundColor: base, borderRadius: 2, order: 2 },
              { label: "Season average (" + avg.toFixed(1) + ")", type: "line", data: vals.map(function() { return avg; }), borderColor: "#38bdf8", borderDash: [6, 4], borderWidth: 2, pointRadius: 0, order: 1 }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            indexAxis: "y",
            onHover: function(e, els) { if (e.native && e.native.target) e.native.target.style.cursor = els.length ? "pointer" : "default"; },
            onClick: function(e, els) {
              if (els.length) {
                var clickIndex = els[0].index;
                if (currentFilter === "all") {
                  sel = clickIndex;
                } else {
                  var filtered = getFilteredData();
                  sel = filtered.indices[clickIndex];
                }
              } else {
                sel = -1;
              }
              renderDetail();
              paint();
            },
            plugins: {
              legend: { labels: { color: "#e2e8f0", boxWidth: 12 } },
              tooltip: {
                callbacks: {
                  label: function(c) {
                    if (c.datasetIndex === 1) return "Average " + (c.chart.data.datasets[1].label.split('(')[1].replace(')', ''));
                    var dataIndex = currentFilter === "all" ? c.dataIndex : getFilteredData().indices[c.dataIndex];
                    var d = DATA[dataIndex];
                    var actualTotal = d[2] + d[4];
                    return ["Actual: " + actualTotal, "Line: " + d[5], "Result: " + (d[6] === "O" ? "OVER" : "UNDER")];
                  }
                }
              }
            },
            scales: {
              y: { ticks: { color: "#94a3b8", autoSkip: false, font: { size: 9 } }, grid: { display: false } },
              x: { ticks: { color: "#94a3b8" }, grid: { color: "#1e293b" }, suggestedMin: 0, suggestedMax: 100 }
            }
          }
        });

        renderDetail();
        updateStats();
      </script>
    </div>
  </div>
</body>
</html>
