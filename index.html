<!DOCTYPE html>
<html data-host-mode="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026 NFL Game Totals</title>
  <script>Object.defineProperty(document, "cookie", {get: function() { return ""; },set: function() {},configurable: false});</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    :root { 
      --host-bg: rgb(14, 18, 23); 
      --host-fg: rgb(238, 237, 228); 
      --host-fg-muted: rgb(162, 166, 170); 
      --host-card: rgba(255, 255, 255, 0.04); 
      --host-card-fg: rgb(238, 237, 228); 
      --host-input: rgba(255, 255, 255, 0.04); 
      --host-muted: rgba(255, 255, 255, 0.04); 
      --host-border: rgba(255, 255, 255, 0.06); 
      --host-border-hover: rgba(255, 255, 255, 0.12); 
      --host-primary: rgb(18, 92, 161); 
      --host-secondary: rgba(255, 255, 255, 0.04); 
      --host-secondary-fg: rgb(238, 237, 228); 
      --host-success: #22c55e; 
      --host-error: #ef4444; 
    } 
    * { box-sizing: border-box; margin: 0; padding: 0; } 
    :root, html, body { 
      width: 100%; 
      max-width: 100%; 
      height: auto; 
      overflow-x: hidden; 
      overflow-y: visible; 
      background: transparent; 
      font-family: Inter, system-ui, -apple-system, sans-serif; 
    } 
    #sandbox-content { 
      width: 100%; 
    } 
    @media (max-width: 640px) { 
      :where(#sandbox-content svg, #sandbox-content img) { 
        max-width: 100%; 
        height: auto; 
      } 
    }
  </style>
</head>
<body>
  <div id="sandbox-content">
    <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#e2e8f0;padding:22px;border-radius:14px;max-width:700px;margin:0 auto;">
      <h2 style="margin:0 0 4px;font-size:20px;">2026 NFL: Every Game Total — Chronological</h2>
      <p style="margin:0 0 10px;color:#94a3b8;font-size:13px;">65 games played, oldest to newest. Green = went Over, red = went Under. Dashed line = season average of actual totals. Click any bar for details.</p>

      <div id="toast" style="background: rgb(51, 65, 85); color: rgb(226, 232, 240); font-size: 13px; padding: 8px 12px; border-radius: 6px; margin-bottom: 10px; opacity: 0; transition: opacity 0.25s;">Code selected — press Cmd+C</div>

      <div style="height:1060px;">
        <canvas id="c" width="1312" height="2120" style="display: block; box-sizing: border-box; height: 1060px; width: 656px;"></canvas>
      </div>

      <div id="detail" style="margin-top:14px;background:#1e293b;border-left:4px solid #38bdf8;padding:12px 16px;border-radius:8px;min-height:58px;font-size:14px;">
        <span style="color:#94a3b8">Click any bar to see the matchup, line and result.</span>
      </div>

      <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
      <script>
        var DATA=[
          ["9/9","NE",10,"SEA",13,45.5,"U",1],
          ["9/10","SF",27,"LAR",7,48.5,"U",1],
          ["9/13","TB",27,"CIN",33,50.5,"O",1],
          ["9/13","NO",30,"DET",31,49.5,"O",1],
          ["9/13","NYJ",23,"TEN",10,38.5,"U",1],
          ["9/13","BAL",41,"IND",23,47.5,"O",1],
          ["9/13","ATL",13,"PIT",20,41.5,"U",1],
          ["9/13","CHI",59,"CAR",37,47.5,"O",1],
          ["9/13","CLE",10,"JAX",34,39.5,"O",1],
          ["9/13","BUF",36,"HOU",31,44.5,"O",1],
          ["9/13","MIA",13,"LV",27,40.5,"U",1],
          ["9/13","GB",22,"MIN",39,46.5,"O",1],
          ["9/13","WSH",22,"PHI",24,44.5,"O",1],
          ["9/13","ARI",26,"LAC",14,47.5,"U",1],
          ["9/13","DAL",20,"NYG",28,48.5,"U",1],
          ["9/14","DEN",10,"KC",31,43.5,"U",1],
          ["9/17","DET",31,"BUF",41,54.5,"O",2],
          ["9/20","CAR",34,"ATL",3,43.5,"U",2],
          ["9/20","CIN",20,"HOU",6,45.5,"U",2],
          ["9/20","CLE",23,"TB",19,41.5,"O",2],
          ["9/20","GB",20,"NYJ",17,44.5,"U",2],
          ["9/20","MIN",9,"CHI",3,47.5,"U",2],
          ["9/20","NO",24,"BAL",17,45.5,"U",2],
          ["9/20","PHI",24,"TEN",20,39.5,"O",2],
          ["9/20","PIT",3,"NE",20,41.5,"U",2],
          ["9/20","JAX",13,"DEN",20,45.5,"U",2],
          ["9/20","LV",26,"LAC",14,43.5,"U",2],
          ["9/20","MIA",13,"SF",35,44.5,"O",2],
          ["9/20","SEA",31,"ARI",7,40.5,"U",2],
          ["9/20","WSH",20,"DAL",37,50.5,"O",2],
          ["9/20","IND",30,"KC",33,46.5,"O",2],
          ["9/21","NYG",6,"LAR",28,47.5,"U",2],
          ["9/24","ATL",35,"GB",14,43.5,"O",3],
          ["9/27","CAR",18,"CLE",21,41.5,"U",3],
          ["9/27","CIN",27,"PIT",30,42.5,"O",3],
          ["9/27","LAC",16,"BUF",24,50.5,"U",3],
          ["9/27","NE",6,"JAX",35,45.5,"U",3],
          ["9/27","NYJ",24,"DET",31,48.5,"O",3],
          ["9/27","HOU",17,"IND",19,42.5,"U",3],
          ["9/27","KC",24,"MIA",10,45.5,"U",3],
          ["9/27","SEA",31,"WSH",33,40.5,"O",3],
          ["9/27","TEN",7,"NYG",12,37.5,"U",3],
          ["9/27","ARI",30,"SF",36,48.5,"O",3],
          ["9/27","MIN",23,"TB",16,42.5,"U",3],
          ["9/27","BAL",34,"DAL",31,53.5,"O",3],
          ["9/27","LV",35,"NO",27,43.5,"O",3],
          ["9/27","LAR",26,"DEN",30,43.5,"O",3],
          ["9/28","PHI",7,"CHI",27,42.5,"U",3],
          ["10/1","PIT",24,"CLE",27,37.5,"O",4],
          ["10/4","IND",30,"WSH",13,47.5,"U",4],
          ["10/4","ARI",24,"NYG",36,44.5,"O",4],
          ["10/4","DAL",34,"HOU",30,48.5,"O",4],
          ["10/4","GB",17,"TB",14,38.5,"U",4],
          ["10/4","JAX",22,"CIN",17,51.5,"U",4],
          ["10/4","LAR",24,"PHI",20,42.5,"O",4],
          ["10/4","NE",29,"BUF",26,49.5,"O",4],
          ["10/4","NYJ",12,"CHI",23,43.5,"U",4],
          ["10/4","TEN",18,"BAL",24,42.5,"U",4],
          ["10/4","MIA",10,"MIN",15,38.5,"U",4],
          ["10/4","DEN",14,"SF",24,48.5,"U",4],
          ["10/4","KC",30,"LV",27,47.5,"O",4],
          ["10/4","LAC",23,"SEA",30,42.5,"O",4],
          ["10/4","DET",26,"CAR",32,51.5,"O",4],
          ["10/5","ATL",45,"NO",24,47.5,"O",4],
          ["10/8","TB",24,"DAL",16,49.5,"U",5]
        ];

        // Calculate actual game totals (team1_score + team2_score)
        var actualTotals = DATA.map(function(d) { return d[2] + d[4]; });
        
        var labels = DATA.map(function(d) { return d[0] + "  ·  " + d[1] + " @" + d[3]; });
        var vals = actualTotals; // Use actual totals instead of betting line
        var base = DATA.map(function(d) { return d[6] === "O" ? "#22c55e" : "#ef4444"; });
        var avg = vals.reduce(function(a, b) { return a + b; }, 0) / vals.length;
        var sel = -1;
        var detail = document.getElementById("detail");

        function renderDetail() {
          if (sel < 0) {
            detail.innerHTML = '<span style="color:#94a3b8">Click any bar to see the matchup, line and result.</span>';
            return;
          }
          var d = DATA[sel], actual = d[2] + d[4], diff = (actual - d[5]).toFixed(1), over = d[6] === "O";
          detail.innerHTML = '<div style="font-size:15px;font-weight:700;margin-bottom:6px">Week ' + d[7] + ' · ' + d[0] + ' · ' + d[1] + ' ' + d[2] + ', ' + d[3] + ' ' + d[4] + '</div>'
            + '<div style="color:#cbd5e1;font-size:13px">Over/Under line: <b>' + d[5] + '</b> &nbsp;·&nbsp; Final total: <b>' + actual + '</b></div>'
            + '<div style="margin-top:6px;font-weight:800;color:' + (over ? "#22c55e" : "#ef4444") + '">' + (over ? "OVER" : "UNDER") + ' by ' + Math.abs(diff) + '</div>';
        }

        function paint() {
          chart.data.datasets[0].borderColor = base.map(function(c, i) { return i === sel ? "#ffffff" : c; });
          chart.data.datasets[0].borderWidth = base.map(function(c, i) { return i === sel ? 3 : 0; });
          chart.update();
        }

        var chart = new Chart(document.getElementById("c"), {
          type: "bar",
          data: {
            labels: labels,
            datasets: [
              { label: "Actual game total", data: vals, backgroundColor: base, borderRadius: 2, order: 2 },
              { label: "Season average (" + avg.toFixed(1) + ")", type: "line", data: vals.map(function() { return avg; }), borderColor: "#38bdf8", borderDash: [6, 4], borderWidth: 2, pointRadius: 0, order: 1 }
            ]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            indexAxis: "y",
            onHover: function(e, els) { if (e.native && e.native.target) e.native.target.style.cursor = els.length ? "pointer" : "default"; },
            onClick: function(e, els) { sel = els.length ? els[0].index : -1; renderDetail(); paint(); },
            plugins: {
              legend: { labels: { color: "#e2e8f0", boxWidth: 12 } },
              tooltip: {
                callbacks: {
                  label: function(c) {
                    if (c.datasetIndex === 1) return "Average " + avg.toFixed(1);
                    var d = DATA[c.dataIndex];
                    var actualTotal = d[2] + d[4];
                    return ["Actual total: " + actualTotal, "Line: " + d[5], "Result: " + (d[6] === "O" ? "OVER" : "UNDER")];
                  }
                }
              }
            },
            scales: {
              y: { ticks: { color: "#94a3b8", autoSkip: false, font: { size: 9 } }, grid: { display: false } },
              x: { ticks: { color: "#94a3b8" }, grid: { color: "#1e293b" }, suggestedMin: 0, suggestedMax: 100 }
            }
          }
        });
        renderDetail();
      </script>
    </div>
  </div>
</body>
</html>
