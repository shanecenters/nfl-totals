<!DOCTYPE html>
<html data-host-mode="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026 NFL Game Totals - Team & Day Filters</title>
  <script>Object.defineProperty(document, "cookie", {get: function() { return ""; },set: function() {},configurable: false});</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    :root { 
      --host-bg: rgb(14, 18, 23); 
      --host-fg: rgb(238, 237, 228); 
      --host-fg-muted: rgb(162, 166, 170); 
      --host-card: rgba(255, 255, 255, 0.04); 
      --host-card-fg: rgb(238, 237, 228); 
      --host-input: rgba(255, 255, 255, 0.04); 
      --host-muted: rgba(255, 255, 255, 0.04); 
      --host-border: rgba(255, 255, 255, 0.06); 
      --host-border-hover: rgba(255, 255, 255, 0.12); 
      --host-primary: rgb(18, 92, 161); 
      --host-secondary: rgba(255, 255, 255, 0.04); 
      --host-secondary-fg: rgb(238, 237, 228); 
      --host-success: #22c55e; 
      --host-error: #ef4444; 
    } 
    * { box-sizing: border-box; margin: 0; padding: 0; } 
    :root, html, body { 
      width: 100%; 
      max-width: 100%; 
      height: auto; 
      overflow-x: hidden; 
      overflow-y: visible; 
      background: transparent; 
      font-family: Inter, system-ui, -apple-system, sans-serif; 
    } 
    #sandbox-content { width: 100%; }
    @media (max-width: 640px) { 
      :where(#sandbox-content svg, #sandbox-content img) { 
        max-width: 100%; 
        height: auto; 
      } 
    }
    
    .filter-section {
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    
    .filter-label {
      color: #94a3b8;
      font-size: 13px;
      font-weight: 500;
    }
    
    .team-select {
      flex: 1;
      min-width: 140px;
      background: #334155;
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      font-family: Inter, sans-serif;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    
    .team-select:hover {
      border-color: rgba(255, 255, 255, 0.2);
    }
    
    .team-select:focus {
      outline: none;
      border-color: #38bdf8;
    }
    
    .team-select option {
      background: #1e293b;
      color: #e2e8f0;
    }
    
    .filter-stats {
      color: #94a3b8;
      font-size: 13px;
      margin-left: auto;
    }
    
    .reset-btn {
      background: #334155;
      color: #e2e8f0;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .reset-btn:hover {
      background: #475569;
    }
  </style>
</head>
<body>
  <div id="sandbox-content">
    <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#e2e8f0;padding:22px;border-radius:14px;max-width:700px;margin:0 auto;">
      <h2 style="margin:0 0 4px;font-size:20px;">2026 NFL: Every Game Total — Chronological</h2>
      <p style="margin:0 0 15px;color:#94a3b8;font-size:13px;">Filter by team and/or game day. Green = went Over, red = went Under.</p>

      <div class="filter-section">
        <label class="filter-label">Team:</label>
        <select class="team-select" id="teamFilter">
          <option value="all">All Teams</option>
        </select>
        
        <label class="filter-label">Day:</label>
        <select class="team-select" id="dayFilter">
          <option value="all">All Days</option>
          <option value="sunday">Sunday</option>
          <option value="monday">Monday Night</option>
          <option value="thursday">Thursday Night</option>
          <option value="international">International</option>
        </select>
        
        <span class="filter-stats" id="filterStats"></span>
        <button class="reset-btn" onclick="resetFilter()">Reset</button>
      </div>

      <div id="toast" style="background: rgb(51, 65, 85); color: rgb(226, 232, 240); font-size: 13px; padding: 8px 12px; border-radius: 6px; margin-bottom: 10px; opacity: 0; transition: opacity 0.25s;">Code selected</div>

      <div id="chartContainer" style="height:1060px; transition: height 0.3s ease;">
        <canvas id="c" width="1312" height="2120" style="display: block; box-sizing: border-box; height: 1060px; width: 656px;"></canvas>
      </div>

      <div id="detail" style="margin-top:14px;background:#1e293b;border-left:4px solid #38bdf8;padding:12px 16px;border-radius:8px;min-height:58px;font-size:14px;">
        <span style="color:#94a3b8">Click any bar to see the matchup, line and result.</span>
      </div>

      <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
      <script>
        var DATA=[
          ["10/2","PIT",24,"CLE",27,45.0,"U",4],
          ["10/4","IND",30,"WSH",13,45.0,"U",4],
          ["10/4","NE",29,"BUF",26,45.0,"U",4],
          ["10/4","NYJ",12,"CHI",23,45.0,"U",4],
          ["10/4","JAX",22,"CIN",17,45.0,"U",4],
          ["10/4","ARI",24,"NYG",36,45.0,"U",4],
          ["10/4","LAR",24,"PHI",20,45.0,"U",4],
          ["10/4","GB",17,"TB",14,45.0,"U",4],
          ["10/4","TEN",18,"BAL",24,45.0,"U",4],
          ["10/4","DAL",34,"HOU",30,45.0,"U",4],
          ["10/4","MIA",10,"MIN",15,45.0,"U",4],
          ["10/4","KC",30,"LV",27,45.0,"U",4],
          ["10/4","DEN",14,"SF",24,45.0,"U",4],
          ["10/4","LAC",23,"SEA",30,45.0,"U",4],
          ["10/5","DET",26,"CAR",32,45.0,"U",4],
          ["10/6","ATL",45,"NO",24,45.0,"U",4],
          ["10/9","TB",24,"DAL",16,45.0,"U",5],
          ["9/10","NE",10,"SEA",13,45.0,"U",1],
          ["9/11","SF",27,"LAR",7,45.0,"U",1],
          ["9/13","TB",27,"CIN",33,45.0,"U",1],
          ["9/13","NO",30,"DET",31,45.0,"U",1],
          ["9/13","NYJ",23,"TEN",10,45.0,"U",1],
          ["9/13","BAL",41,"IND",23,45.0,"U",1],
          ["9/13","ATL",13,"PIT",20,45.0,"U",1],
          ["9/13","CHI",59,"CAR",37,45.0,"U",1],
          ["9/13","CLE",10,"JAX",34,45.0,"U",1],
          ["9/13","BUF",36,"HOU",31,45.0,"U",1],
          ["9/13","MIA",13,"LV",27,45.0,"U",1],
          ["9/13","GB",22,"MIN",39,45.0,"U",1],
          ["9/13","WSH",22,"PHI",24,45.0,"U",1],
          ["9/13","ARI",26,"LAC",14,45.0,"U",1],
          ["9/14","DAL",20,"NYG",28,45.0,"U",1],
          ["9/15","DEN",10,"KC",31,45.0,"U",1],
          ["9/18","DET",31,"BUF",41,45.0,"U",2],
          ["9/20","CAR",34,"ATL",3,45.0,"U",2],
          ["9/20","MIN",9,"CHI",3,45.0,"U",2],
          ["9/20","PHI",24,"TEN",20,45.0,"U",2],
          ["9/20","PIT",3,"NE",20,45.0,"U",2],
          ["9/20","GB",20,"NYJ",17,45.0,"U",2],
          ["9/20","CLE",23,"TB",19,45.0,"U",2],
          ["9/20","NO",24,"BAL",17,45.0,"U",2],
          ["9/20","CIN",20,"HOU",6,45.0,"U",2],
          ["9/20","JAX",13,"DEN",20,45.0,"U",2],
          ["9/20","LV",26,"LAC",14,45.0,"U",2],
          ["9/20","WSH",20,"DAL",37,45.0,"U",2],
          ["9/20","SEA",31,"ARI",7,45.0,"U",2],
          ["9/20","MIA",13,"SF",35,45.0,"U",2],
          ["9/21","IND",30,"KC",33,45.0,"U",2],
          ["9/22","NYG",6,"LAR",28,45.0,"U",2],
          ["9/25","ATL",35,"GB",14,45.0,"U",3],
          ["9/27","LAC",16,"BUF",24,45.0,"U",3],
          ["9/27","CAR",18,"CLE",21,45.0,"U",3],
          ["9/27","NYJ",24,"DET",31,45.0,"U",3],
          ["9/27","HOU",17,"IND",19,45.0,"U",3],
          ["9/27","KC",24,"MIA",10,45.0,"U",3],
          ["9/27","TEN",7,"NYG",12,45.0,"U",3],
          ["9/27","CIN",27,"PIT",30,45.0,"U",3],
          ["9/27","SEA",31,"WSH",33,45.0,"U",3],
          ["9/27","NE",6,"JAX",35,45.0,"U",3],
          ["9/27","ARI",30,"SF",36,45.0,"U",3],
          ["9/27","MIN",23,"TB",16,45.0,"U",3],
          ["9/27","BAL",34,"DAL",31,45.0,"U",3],
          ["9/27","LV",35,"NO",27,45.0,"U",3],
          ["9/28","LAR",26,"DEN",30,45.0,"U",3],
          ["9/29","PHI",7,"CHI",27,45.0,"U",3],
        ];

        var TEAM_ABBREVIATIONS = [
          "ARI", "ATL", "BAL", "BUF", "CAR", "CHI", "CIN", "CLE",
          "DAL", "DEN", "DET", "GB", "HOU", "IND", "JAX", "KC",
          "LAC", "LAR", "LV", "MIA", "MIN", "NE", "NO", "NYG",
          "NYJ", "PHI", "PIT", "SEA", "SF", "TB", "TEN", "WSH"
        ];

        // Populate team dropdown
        var teamSelect = document.getElementById("teamFilter");
        TEAM_ABBREVIATIONS.forEach(function(team) {
          var option = document.createElement("option");
          option.value = team;
          option.textContent = team;
          teamSelect.appendChild(option);
        });

        var daySelect = document.getElementById("dayFilter");
        var currentTeamFilter = "all";
        var currentDayFilter = "all";
        var sel = -1;

        // Calculate actual totals for bars
        var actualTotals = DATA.map(function(d) { return d[2] + d[4]; });
        
        var labels = DATA.map(function(d) { return d[0] + "  ·  " + d[1] + " @" + d[3]; });
        var vals = actualTotals;
        var base = DATA.map(function(d) { return d[6] === "O" ? "#22c55e" : "#ef4444"; });
        var avg = vals.reduce(function(a, b) { return a + b; }, 0) / vals.length;
        
        var detail = document.getElementById("detail");

        function renderDetail() {
          if (sel < 0) {
            detail.innerHTML = '<span style="color:#94a3b8">Click any bar to see the matchup, line and result.</span>';
            return;
          }
          var d = DATA[sel], actual = d[2] + d[4], diff = (actual - d[5]).toFixed(1), over = d[6] === "O";
          detail.innerHTML = '<div style="font-size:15px;font-weight:700;margin-bottom:6px">Week ' + d[7] + ' · ' + d[0] + ' · ' + d[1] + ' ' + d[2] + ', ' + d[3] + ' ' + d[4] + '</div>'
            + '<div style="color:#cbd5e1;font-size:13px">Over/Under line: <b>' + d[5] + '</b> &nbsp;·&nbsp; Final total: <b>' + actual + '</b></div>'
            + '<div style="margin-top:6px;font-weight:800;color:' + (over ? "#22c55e" : "#ef4444") + '">' + (over ? "OVER" : "UNDER") + ' by ' + Math.abs(diff) + '</div>';
          detail.style.borderLeftColor = over ? "#22c55e" : "#ef4444";
        }

        function paint() {
          if (!chart) return;
          chart.data.datasets[0].borderColor = base.map(function(c, i) { return i === sel ? "#ffffff" : c; });
          chart.data.datasets[0].borderWidth = base.map(function(c, i) { return i === sel ? 3 : 0; });
          chart.update('none');
        }

        function getDayOfWeek(dateStr) {
          // Parse date format "M/D"
          var parts = dateStr.split('/');
          if (parts.length !== 2) return 'sunday';
          
          var month = parseInt(parts[0]);
          var day = parseInt(parts[1]);
          
          // Map specific dates to days for 2026 NFL season
          var dateToDay = {
            // Week 1
            "9/10": "thursday", "9/11": "friday", "9/13": "sunday", "9/14": "monday", "9/15": "monday",
            // Week 2
            "9/17": "thursday", "9/20": "sunday", "9/21": "monday", "9/22": "tuesday",
            // Week 3
            "9/24": "thursday", "9/27": "sunday", "9/28": "monday", "9/29": "tuesday",
            // Week 4
            "10/1": "wednesday", "10/4": "sunday", "10/5": "monday", "10/6": "tuesday",
            // Week 5
            "10/8": "thursday", "10/9": "sunday", "10/10": "monday", "10/11": "tuesday",
            // Week 6
            "10/15": "thursday", "10/18": "sunday", "10/19": "monday", "10/20": "tuesday",
            // Week 7
            "10/22": "thursday", "10/25": "sunday", "10/26": "monday", "10/27": "tuesday",
            // Week 8
            "10/29": "thursday", "10/30": "wednesday", "10/31": "thursday", "11/1": "friday", "11/2": "saturday",
            // Week 9
            "11/5": "tuesday", "11/8": "friday", "11/9": "saturday"
          };
          
          var day = dateToDay[dateStr] || 'sunday';
          
          // Special case: International games (typically Saturday games in London, Mexico City, etc.)
          if (day === 'saturday') {
            day = 'international';
          }
          
          return day;
        }

        function getFilteredData() {
          var filteredIndices = [];
          
          for (var i = 0; i < DATA.length; i++) {
            var includeGame = true;
            
            // Apply team filter
            if (currentTeamFilter !== "all") {
              if (DATA[i][1] !== currentTeamFilter && DATA[i][3] !== currentTeamFilter) {
                includeGame = false;
              }
            }
            
            // Apply day filter
            if (currentDayFilter !== "all" && includeGame) {
              var gameDate = DATA[i][0];
              var gameDay = getDayOfWeek(gameDate);
              
              if (gameDay !== currentDayFilter) {
                includeGame = false;
              }
            }
            
            if (includeGame) {
              filteredIndices.push(i);
            }
          }
          
          if (filteredIndices.length === 0) {
            return { data: DATA, labels: labels, vals: vals, base: base, indices: [] };
          }
          
          return {
            data: filteredIndices.map(function(i) { return DATA[i]; }),
            labels: filteredIndices.map(function(i) { return labels[i]; }),
            vals: filteredIndices.map(function(i) { return vals[i]; }),
            base: filteredIndices.map(function(i) { return base[i]; }),
            indices: filteredIndices
          };
        }

        function updateChart() {
          var filtered = getFilteredData();
          
          if (filtered.indices.length === 0) {
            document.getElementById("filterStats").textContent = "No games match filters";
            return;
          }
          
          var newAvg = filtered.vals.reduce(function(a, b) { return a + b; }, 0) / filtered.vals.length;
          
          // Calculate dynamic height based on number of games
          var numGames = filtered.vals.length;
          var gameHeight = 40;
          var minHeight = 300;
          var maxHeight = 1200;
          var calculatedHeight = Math.max(minHeight, Math.min(maxHeight, numGames * gameHeight));
          
          // Update container and canvas heights
          var container = document.getElementById("chartContainer");
          container.style.height = calculatedHeight + "px";
          
          var canvas = document.getElementById("c");
          canvas.style.height = calculatedHeight + "px";
          
          // Update chart dimensions
          chart.options.maintainAspectRatio = false;
          chart.resize();
          
          chart.data.labels = filtered.labels;
          chart.data.datasets[0].data = filtered.vals;
          chart.data.datasets[0].backgroundColor = filtered.base;
          chart.data.datasets[1].data = filtered.vals.map(function() { return newAvg; });
          chart.data.datasets[1].label = "Season average (" + newAvg.toFixed(1) + ")";
          
          sel = -1;
          renderDetail();
          chart.update();
          updateStats();
        }

        function updateStats() {
          var statsDiv = document.getElementById("filterStats");
          var filtered = getFilteredData();
          
          if (filtered.indices.length === 0) {
            statsDiv.textContent = "No matches";
            return;
          }
          
          var teamText = currentTeamFilter === "all" ? "All teams" : currentTeamFilter;
          var dayText = currentDayFilter === "all" ? "all days" : currentDayFilter;
          var overCount = 0;
          
          filtered.data.forEach(function(d) {
            if (d[6] === "O") overCount++;
          });
          
          statsDiv.textContent = filtered.data.length + " games · " + overCount + " Over, " + (filtered.data.length - overCount) + " Under";
        }

        function resetFilter() {
          currentTeamFilter = "all";
          currentDayFilter = "all";
          teamSelect.value = "all";
          daySelect.value = "all";
          updateChart();
        }

        teamSelect.addEventListener("change", function() {
          currentTeamFilter = this.value;
          updateChart();
        });

        daySelect.addEventListener("change", function() {
          currentDayFilter = this.value;
          updateChart();
        });

        var chart = new Chart(document.getElementById("c"), {
          type: "bar",
          data: {
            labels: labels,
            datasets: [
              { label: "Actual game total", data: vals, backgroundColor: base, borderRadius: 2, order: 2 },
              { label: "Season average (" + avg.toFixed(1) + ")", type: "line", data: vals.map(function() { return avg; }), borderColor: "#38bdf8", borderDash: [6, 4], borderWidth: 2, pointRadius: 0, order: 1 }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            indexAxis: "y",
            onHover: function(e, els) { if (e.native && e.native.target) e.native.target.style.cursor = els.length ? "pointer" : "default"; },
            onClick: function(e, els) {
              if (els.length) {
                var clickIndex = els[0].index;
                var filtered = getFilteredData();
                sel = filtered.indices[clickIndex];
              } else {
                sel = -1;
              }
              renderDetail();
              paint();
            },
            plugins: {
              legend: { labels: { color: "#e2e8f0", boxWidth: 12 } },
              tooltip: {
                callbacks: {
                  label: function(c) {
                    if (c.datasetIndex === 1) return "Average " + (c.chart.data.datasets[1].label.split('(')[1].replace(')', ''));
                    var filtered = getFilteredData();
                    var dataIndex = filtered.indices[c.dataIndex];
                    var d = DATA[dataIndex];
                    var actualTotal = d[2] + d[4];
                    return ["Actual: " + actualTotal, "Line: " + d[5], "Result: " + (d[6] === "O" ? "OVER" : "UNDER")];
                  }
                }
              }
            },
            scales: {
              y: { ticks: { color: "#94a3b8", autoSkip: false, font: { size: 9 } }, grid: { display: false } },
              x: { ticks: { color: "#94a3b8" }, grid: { color: "#1e293b" }, suggestedMin: 0, suggestedMax: 100 }
            }
          }
        });

        renderDetail();
        updateStats();
      </script>
    </div>
  </div>
</body>
</html>
